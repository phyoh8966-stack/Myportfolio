<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>HTML Form</title>
        <style type="text/css">
            label{
                border: 1px solid gray;
                border-radius: 5px;
                background-color: aqua;
                color: burlywood;
                padding-left: 4px;
                padding-right: 5px;
                margin-right: 5px;
            }
        </style>
    </head>
    <body>
        <h2>Simple Form</h2>
        <form action="page-handler.html" method="get">
            <input type="text" name="full-name" placeholder="full-name"/><br/><br/>
            <input type="text" name="age" placeholder="age"/><br/><br/>
            <input type="text" name="hobby" placeholder="hobby"/><br/><br/>
            <input type="submit" />
        </form>
        <h2>From Label</h2>
        <label for="demo">First Name:</label>
        <input type="text" id="demo" placeholder="first name"/>

    </body>
</html>
